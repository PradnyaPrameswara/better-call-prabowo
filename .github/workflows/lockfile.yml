name: Generate pnpm lockfile
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/lockfile.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/09-browser-qa-and-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Resolve and write lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit pinned dependency graph
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit pnpm lockfile for reproducible CI'
          git push origin HEAD:refs/heads/${{ github.head_ref }}
