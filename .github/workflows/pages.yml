name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify source
        run: |
          pnpm run check
          pnpm run media:verify
      - name: Build static site for GitHub Pages
        env:
          SITE_BASE: /better-call-prabowo/
          SITE_URL: https://pradnyaprameswara.github.io
        run: pnpm run build
      - name: Verify generated paths
        run: pnpm run pages:verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
