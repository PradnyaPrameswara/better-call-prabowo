name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm run check
          pnpm run media:verify
      - name: Build static site for GitHub Pages
        env:
          SITE_BASE: /better-call-prabowo/
          SITE_URL: https://pradnyaprameswara.github.io
        run: pnpm run build
      - name: Verify generated paths
        run: pnpm run pages:verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published GitHub Pages
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          root="${DEPLOYED_URL%/}"
          if [[ "$root" != "https://pradnyaprameswara.github.io/better-call-prabowo" ]]; then
            echo "Unexpected Pages deployment URL: $root" >&2
            exit 1
          fi
          for route in "" "testimonials/" "asseenontv/" "ecards/" "livewebcam/"; do
            url="$root/$route"
            html=$(curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 "$url")
            if [[ "$html" != *"Better Call Prabowo"* ]]; then
              echo "Missing expected site content: $url" >&2
              exit 1
            fi
            echo "Verified: $url"
          done
          for image in "images/prabowo/portrait.jpg" "images/scales.svg"; do
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 \
              --output /dev/null "$root/$image"
            echo "Verified asset: $image"
          done
