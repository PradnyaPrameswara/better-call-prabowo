name: Import additional sourced photos
on:
  pull_request:
    paths:
      - scripts/import-photos.mjs
      - .github/workflows/import-stage12-media.yml

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/12-copy-photo-framing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Download and validate all locally missing Commons JPEGs
        run: node scripts/import-photos.mjs
      - name: Commit selected photos
        run: |
          git add public/images/prabowo/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: add three credited Commons archival photos'
          git push origin HEAD:refs/heads/${{ github.head_ref }}
