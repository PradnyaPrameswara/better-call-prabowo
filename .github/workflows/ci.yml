name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Verify Vercel UI SDK imports
        run: node --input-type=module -e "await import('@ui-sdk/core/button'); await import('@ui-sdk/react/button');"
      - name: Astro diagnostics
        run: pnpm run check
      - name: Verify locally stored media assets
        run: pnpm run media:verify
      - name: Static build
        run: pnpm run build
