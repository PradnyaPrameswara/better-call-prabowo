name: Import curated Commons photos
on:
  pull_request:
    paths:
      - scripts/import-photos.mjs
      - .github/workflows/import-photos.yml

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/07-ecards-webcam'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Download and validate credited JPEGs
        run: node scripts/import-photos.mjs
      - name: Commit imported images to this feature branch
        run: |
          git add public/images/prabowo/*.jpg
          if git diff --cached --quiet; then
            echo "Already imported"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: add credited Prabowo photo archive'
          git push origin HEAD:refs/heads/${{ github.head_ref }}
